# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and Deploy to MonsterASP.NET - facestone

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore FaceStone.sln

      - name: Build with dotnet
        run: dotnet build FaceStone.sln --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish FaceStone.Web.csproj --configuration Release --no-build -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      # Deploy to MonsterASP.NET using Web Deploy if MONSTERASP_PASSWORD is configured
      - name: Deploy to MonsterASP.NET via WebDeploy
        if: env.MONSTERASP_PASSWORD != ''
        shell: pwsh
        env:
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
          MONSTERASP_USERNAME: ${{ secrets.MONSTERASP_USERNAME || 'site92914' }}
          MONSTERASP_SITE_NAME: ${{ secrets.MONSTERASP_SITE_NAME || 'site92914' }}
          MONSTERASP_SERVER: ${{ secrets.MONSTERASP_SERVER || 'site92914.siteasp.net:8172' }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          if (Test-Path $msdeploy) {
            Write-Host "Deploying to MonsterASP.NET site $env:MONSTERASP_SITE_NAME at $env:MONSTERASP_SERVER..."
            & $msdeploy -verb:sync -source:contentPath="$(Get-Location)\publish" -dest:contentPath="$($env:MONSTERASP_SITE_NAME)",computerName="https://$($env:MONSTERASP_SERVER)/msdeploy.axd",userName="$($env:MONSTERASP_USERNAME)",password="$($env:MONSTERASP_PASSWORD)",authtype="Basic" -allowUntrusted
            Write-Host "Deployment to MonsterASP.NET completed successfully."
          } else {
            Write-Host "msdeploy.exe not found on runner; deployment artifact is preserved in build artifacts."
          }
